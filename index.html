<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🚗 香港車友出車盲盒 - 20個勝地隨機導航</title>
    <style>
        :root {
            --bg-dark: #090d16;
            --bg-card: #131c2e;
            --primary: #38bdf8;
            --primary-glow: rgba(56, 189, 248, 0.3);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #f43f5e;
            --success: #10b981;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            margin: 0;
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .container {
            width: 100%;
            max-width: 420px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .header {
            text-align: center;
        }
        .header h2 {
            color: var(--primary);
            font-size: 22px;
            margin: 0 0 4px 0;
            text-shadow: 0 0 10px var(--primary-glow);
        }
        .header p {
            color: var(--text-muted);
            font-size: 13px;
            margin: 0;
        }

        .map-card {
            background: var(--bg-card);
            border-radius: 20px;
            padding: 20px;
            border: 1px solid #1e293b;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            gap: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
            position: relative;
            overflow: hidden;
        }

        .radar-circle {
            width: 120px;
            height: 120px;
            border: 2px dashed var(--primary);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            animation: pulseRadar 2s infinite linear;
            margin: 10px 0;
        }

        @keyframes pulseRadar {
            0% { box-shadow: 0 0 0 0 rgba(56, 189, 248, 0.2); }
            70% { box-shadow: 0 0 0 20px rgba(56, 189, 248, 0); }
            100% { box-shadow: 0 0 0 0 rgba(56, 189, 248, 0); }
        }

        .radar-icon {
            font-size: 40px;
        }

        .destination-title {
            font-size: 22px;
            font-weight: bold;
            color: var(--text-main);
            margin: 0;
        }

        .destination-desc {
            font-size: 13px;
            color: var(--text-muted);
            line-height: 1.5;
            margin: 0;
        }

        .tag-row {
            display: flex;
            gap: 8px;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 4px;
        }

        .tag {
            background: rgba(56, 189, 248, 0.1);
            color: var(--primary);
            font-size: 11px;
            padding: 4px 8px;
            border-radius: 6px;
            font-weight: bold;
        }

        .roll-btn {
            background: linear-gradient(135deg, var(--primary) 0%, #0284c7 100%);
            color: #0b0f19;
            font-weight: bold;
            border: none;
            padding: 16px;
            border-radius: 16px;
            font-size: 18px;
            cursor: pointer;
            width: 100%;
            box-shadow: 0 6px 20px var(--primary-glow);
            transition: transform 0.1s;
        }
        .roll-btn:active { transform: scale(0.97); }

        .nav-btn {
            background: #2563eb;
            color: #fff;
            font-weight: bold;
            border: none;
            padding: 12px;
            border-radius: 12px;
            font-size: 15px;
            cursor: pointer;
            width: 100%;
            text-decoration: none;
            display: inline-block;
            box-sizing: border-box;
            box-shadow: 0 4px 15px rgba(37, 99, 235, 0.3);
            margin-top: 4px;
        }

        .history-card {
            background: var(--bg-card);
            border-radius: 14px;
            padding: 14px;
            border: 1px solid #1e293b;
            font-size: 13px;
        }
        .history-card h4 {
            margin: 0 0 8px 0;
            color: var(--text-muted);
            font-size: 12px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h2>🚗 香港車友出車盲盒</h2>
        <p>20個免禁區勝地，一鍵高德地圖導航</p>
    </div>

    <div class="map-card" id="mapCard">
        <div class="radar-circle">
            <div class="radar-icon" id="destIcon">🗺️</div>
        </div>
        <div class="tag-row" id="destTags">
            <span class="tag">隨時候命</span>
        </div>
        <h3 class="destination-title" id="destTitle">準備出車</h3>
        <p class="destination-desc" id="destDesc">點擊下方按鈕，隨機抽中香港開車勝地！</p>
        
        <a id="navLink" href="#" class="nav-btn" style="display: none;" target="_blank">🗺️ 一鍵跳轉高德地圖導航</a>
    </div>

    <button class="roll-btn" onclick="rollDestination()">🎲 隨機決定！去邊度好？</button>

    <div class="history-card">
        <h4>📜 最近抽中記錄</h4>
        <div id="historyList" style="color: var(--text-muted); font-size: 12px;">暫無記錄</div>
    </div>
</div>

        { name: "8號貨櫃碼頭 (昂船洲)", icon: "🏗️", tags: ["工業風夜景", "極具氣勢"], desc: "昂船洲大橋下與貨櫃碼頭交界，金屬感同燈光極具賽博朋克風格。", keyword: "昂船洲八號貨櫃碼頭" }
